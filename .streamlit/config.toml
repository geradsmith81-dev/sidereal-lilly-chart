[server]
headless = true

[browser]
gatherUsageStats = false

# The app is always dark (user request). The same dark "Lagoon" colours are given for Streamlit's light and dark
# themes too, so the screen stays dark whatever the visitor's phone or computer is set to, and whatever is chosen
# in the app's menu (Settings > theme).
[theme]
base = "dark"
font = "sans serif"
primaryColor = "#b5461a"
backgroundColor = "#0b111c"
secondaryBackgroundColor = "#111927"
textColor = "#f7f1ea"
linkColor = "#6fd0dc"
codeBackgroundColor = "#172134"
codeTextColor = "#ffcd9c"

[theme.dark]
primaryColor = "#b5461a"
backgroundColor = "#0b111c"
secondaryBackgroundColor = "#111927"
textColor = "#f7f1ea"
linkColor = "#6fd0dc"
codeBackgroundColor = "#172134"
codeTextColor = "#ffcd9c"

[theme.light]
primaryColor = "#b5461a"
backgroundColor = "#0b111c"
secondaryBackgroundColor = "#111927"
textColor = "#f7f1ea"
linkColor = "#6fd0dc"
codeBackgroundColor = "#172134"
codeTextColor = "#ffcd9c"
# Streamlit builds its "light" slot on a light base; these are the colours of its own dark theme, so that alerts,
# borders and tables stay dark too.
redColor = "#ff2b2b"
orangeColor = "#ff8700"
yellowColor = "#ffe312"
blueColor = "#0068c9"
greenColor = "#09ab3b"
violetColor = "#803df5"
grayColor = "#555867"
redBackgroundColor = "rgba(255, 108, 108, 0.2)"
orangeBackgroundColor = "rgba(255, 135, 0, 0.2)"
yellowBackgroundColor = "rgba(255, 255, 18, 0.2)"
blueBackgroundColor = "rgba(61, 157, 243, 0.2)"
greenBackgroundColor = "rgba(61, 213, 109, 0.2)"
violetBackgroundColor = "rgba(154, 93, 255, 0.2)"
grayBackgroundColor = "rgba(128, 132, 149, 0.2)"
redTextColor = "#ff6c6c"
orangeTextColor = "#ffbd45"
yellowTextColor = "#ffffc2"
blueTextColor = "#3d9df3"
greenTextColor = "#5ce488"
violetTextColor = "#b27eff"
grayTextColor = "rgba(250, 250, 250, 0.6)"
borderColor = "rgba(250, 250, 250, 0.2)"
dataframeBorderColor = "rgba(250, 250, 250, 0.2)"
dataframeHeaderBackgroundColor = "#172134"
dataframeHeaderTextColor = "#f7f1ea"
